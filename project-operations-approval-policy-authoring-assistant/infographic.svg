<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Project Operations Approval Policy Authoring Assistant</title><desc id="desc">AI-assisted policy authoring and approval governance workflow with a time entry example.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071b3a"/><stop offset="1" stop-color="#133a72"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#24c4eb"/><stop offset="1" stop-color="#8c7dff"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif;fill:#edf7ff}.muted{fill:#b5cde7}.panel{fill:#12315b;stroke:#386995;stroke-width:2}.small{font-size:21px}.label{font-size:25px;font-weight:700}.heading{font-size:42px;font-weight:800}.step{font-size:18px;font-weight:700;fill:#61dcfa}</style></defs><rect width="1200" height="850" rx="28" fill="url(#bg)"/><rect x="38" y="35" width="1124" height="8" rx="4" fill="url(#accent)"/><text x="600" y="99" text-anchor="middle" font-size="23" font-weight="700" fill="#69dafa">MICROSOFT DYNAMICS 365 PROJECT OPERATIONS</text><text x="600" y="151" text-anchor="middle" class="heading">Approval Policy Authoring Assistant</text><text x="600" y="188" text-anchor="middle" class="small muted">Clearer policies → more reliable AI classifications → accountable approvals</text><g transform="translate(55,240)"><rect width="340" height="158" rx="20" class="panel"/><text x="24" y="40" class="step">01 · DEFINE</text><text x="24" y="79" class="label">Business policy</text><text x="24" y="114" class="small muted">Time · Expense · Material</text><text x="24" y="140" class="small muted">Rules, thresholds, exceptions</text></g><g transform="translate(430,240)"><rect width="340" height="158" rx="20" class="panel"/><text x="24" y="40" class="step">02 · IMPROVE</text><text x="24" y="79" class="label">AI policy review</text><text x="24" y="114" class="small muted">Identify ambiguous wording</text><text x="24" y="140" class="small muted">Recommend refinements</text></g><g transform="translate(805,240)"><rect width="340" height="158" rx="20" class="panel"/><text x="24" y="40" class="step">03 · GOVERN</text><text x="24" y="79" class="label">Human validation</text><text x="24" y="114" class="small muted">Approve policy changes</text><text x="24" y="140" class="small muted">Version and test rules</text></g><path d="M396 320h30m-12-10 12 10-12 10M771 320h30m-12-10 12 10-12 10" stroke="#65e0ff" stroke-width="4" fill="none"/><path d="M600 404v45" stroke="#65e0ff" stroke-width="4"/><path d="m590 437 10 13 10-13" stroke="#65e0ff" stroke-width="4" fill="none"/><rect x="160" y="466" width="880" height="138" rx="20" fill="#174c77" stroke="#47badb" stroke-width="2"/><text x="600" y="505" text-anchor="middle" class="step">04 · ACTIVITY APPROVALS AGENT</text><text x="600" y="543" text-anchor="middle" class="label">Classifies submitted project activities</text><rect x="260" y="558" width="305" height="31" rx="15" fill="#18655d"/><text x="412" y="580" text-anchor="middle" font-size="19">Ready for approval</text><rect x="635" y="558" width="305" height="31" rx="15" fill="#75512d"/><text x="787" y="580" text-anchor="middle" font-size="19">Needs review</text><rect x="55" y="638" width="1090" height="129" rx="18" class="panel"/><text x="80" y="678" class="step">FUNCTIONAL CONSULTANT EXAMPLE</text><text x="80" y="715" class="small">40 hours submitted → routine review   |   48 hours submitted → exception review*</text><text x="80" y="748" font-size="17" class="muted">*Illustrative customer threshold; supported data and policy behavior must be validated in UAT.</text><text x="600" y="816" text-anchor="middle" font-size="21" font-weight="700">AI can recommend. Business owners remain accountable.  ·  OV Prakash</text></svg>