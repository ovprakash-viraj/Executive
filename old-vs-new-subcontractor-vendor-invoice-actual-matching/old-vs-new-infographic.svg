<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1620" viewBox="0 0 1280 1620" role="img" aria-labelledby="title desc">
<title id="title">OLD vs NEW: Subcontractor Vendor Invoice to Actual Matching</title>
<desc id="desc">Comparison of the earlier procurement-focused approach and the new 2026 integrated actual matching approach in Dynamics 365 Project Operations.</desc>
<style>
.bg{fill:#f7fbff}.navy{fill:#103b73}.blue{fill:#1d73c9}.teal{fill:#129f9a}.orange{fill:#f37a20}.softb{fill:#eaf4ff}.softt{fill:#eafaf8}.softg{fill:#f7f9fc}.white{fill:#fff}
.title{font:700 44px Arial,sans-serif;fill:#103b73}.sub{font:700 29px Arial,sans-serif;fill:#103b73}.h2{font:700 25px Arial,sans-serif;fill:#103b73}.h3{font:700 22px Arial,sans-serif;fill:#103b73}.body{font:18px Arial,sans-serif;fill:#274b70}.small{font:16px Arial,sans-serif;fill:#3c5f80}.center{text-anchor:middle}.card{fill:#fff;stroke:#d7e6f3;stroke-width:2}.line{stroke:#c9d8e5;stroke-width:2}
</style>
<rect width="1280" height="1620" class="bg"/>

<text x="640" y="62" class="title center">
<tspan fill="#f05b18">OLD</tspan><tspan> vs </tspan><tspan fill="#129f9a">NEW</tspan><tspan>: Subcontractor Vendor Invoice</tspan>
</text>
<text x="640" y="112" class="title center">→ Actual Matching</text>
<text x="640" y="160" class="sub center">Dynamics 365 Project Operations Integrated with ERP</text>
<text x="640" y="198" class="body center">How Microsoft's 2026 enhancement improves AP validation, project cost accuracy and project margin visibility</text>

<g transform="translate(40,240)">
<rect x="0" y="0" width="580" height="84" rx="18" class="orange"/>
<text x="290" y="38" class="h2 white center">OLD APPROACH</text>
<text x="290" y="66" class="small white center">PROCUREMENT FOCUSED</text>

<rect x="0" y="104" width="580" height="650" rx="18" class="card"/>
<text x="28" y="145" class="body">
<tspan x="28" dy="0">Earlier validation focused more heavily</tspan>
<tspan x="28" dy="25">on procurement documents.</tspan>
</text>

<circle cx="55" cy="225" r="24" fill="#ffd6bd"/><text x="55" y="233" class="h3 center">1</text>
<text x="105" y="217" class="h3">AP focus</text>
<text x="105" y="248" class="body">PO → Product Receipt → Vendor Invoice</text>
<line x1="25" y1="285" x2="550" y2="285" class="line"/>

<circle cx="55" cy="345" r="24" fill="#ffd6bd"/><text x="55" y="353" class="h3 center">2</text>
<text x="105" y="337" class="h3">Project Actuals</text>
<text x="105" y="368" class="body">
<tspan x="105" dy="0">Verified separately or through</tspan>
<tspan x="105" dy="24">additional reconciliation</tspan>
</text>
<line x1="25" y1="418" x2="550" y2="418" class="line"/>

<circle cx="55" cy="478" r="24" fill="#ffd6bd"/><text x="55" y="486" class="h3 center">3</text>
<text x="105" y="470" class="h3">Visibility</text>
<text x="105" y="501" class="body">
<tspan x="105" dy="0">Less direct view of project transactions</tspan>
<tspan x="105" dy="24">behind the invoice</tspan>
</text>
<line x1="25" y1="550" x2="550" y2="550" class="line"/>

<circle cx="55" cy="610" r="24" fill="#ffd6bd"/><text x="55" y="618" class="h3 center">4</text>
<text x="105" y="602" class="h3">Exception handling</text>
<text x="105" y="633" class="body">
<tspan x="105" dy="0">Quantity mismatches harder to spot</tspan>
<tspan x="105" dy="24">during invoice review</tspan>
</text>
<line x1="25" y1="682" x2="550" y2="682" class="line"/>

<circle cx="55" cy="742" r="24" fill="#ffd6bd"/><text x="55" y="750" class="h3 center">5</text>
<text x="105" y="734" class="h3">Business impact</text>
<text x="105" y="765" class="body">
<tspan x="105" dy="0">More manual reconciliation between</tspan>
<tspan x="105" dy="24">Finance and Project Operations</tspan>
</text>

<rect x="0" y="790" width="580" height="185" rx="18" class="softg"/>
<text x="28" y="832" class="h3">Typical flow (Old approach)</text>
<text x="290" y="885" class="body center">Subcontract → PO → Product Receipt → Vendor Invoice</text>
<text x="290" y="920" class="body center">→ Separate project reconciliation</text>
</g>

<g transform="translate(660,240)">
<rect x="0" y="0" width="580" height="84" rx="18" class="teal"/>
<text x="290" y="38" class="h2 white center">NEW 2026 APPROACH</text>
<text x="290" y="66" class="small white center">PROJECT + FINANCE INTEGRATED</text>

<rect x="0" y="104" width="580" height="770" rx="18" class="card"/>
<text x="28" y="145" class="body">
<tspan x="28" dy="0">Finance can validate invoices against the underlying</tspan>
<tspan x="28" dy="25">project Actuals more directly.</tspan>
</text>

<circle cx="55" cy="225" r="24" fill="#cceef3"/><text x="55" y="233" class="h3 center">1</text>
<text x="105" y="217" class="h3">Match Actuals</text>
<text x="105" y="248" class="body">Available on the subcontract vendor invoice line</text>
<line x1="25" y1="285" x2="550" y2="285" class="line"/>

<circle cx="55" cy="345" r="24" fill="#cceef3"/><text x="55" y="353" class="h3 center">2</text>
<text x="105" y="337" class="h3">Actual visibility</text>
<text x="105" y="368" class="body">
<tspan x="105" dy="0">View underlying time, expense and material</tspan>
<tspan x="105" dy="24">Actuals behind product receipts</tspan>
</text>
<line x1="25" y1="418" x2="550" y2="418" class="line"/>

<circle cx="55" cy="478" r="24" fill="#cceef3"/><text x="55" y="486" class="h3 center">3</text>
<text x="105" y="470" class="h3">Selection control</text>
<text x="105" y="501" class="body">Match / Unmatch Actuals that belong to the invoice</text>
<line x1="25" y1="550" x2="550" y2="550" class="line"/>

<circle cx="55" cy="610" r="24" fill="#cceef3"/><text x="55" y="618" class="h3 center">4</text>
<text x="105" y="602" class="h3">Receipt alignment</text>
<text x="105" y="633" class="body">Update product receipt based on selected Actuals</text>
<line x1="25" y1="682" x2="550" y2="682" class="line"/>

<circle cx="55" cy="742" r="24" fill="#cceef3"/><text x="55" y="750" class="h3 center">5</text>
<text x="105" y="734" class="h3">Posting outcome</text>
<text x="105" y="765" class="body">Post vendor invoice with stronger validation</text>
<line x1="25" y1="812" x2="550" y2="812" class="line"/>

<circle cx="55" cy="870" r="24" fill="#cceef3"/><text x="55" y="878" class="h3 center">6</text>
<text x="105" y="862" class="h3">Project transaction lifecycle</text>
<text x="105" y="893" class="body">
<tspan x="105" dy="0">Reverse original Actual → create</tspan>
<tspan x="105" dy="24">Vendor Invoice Actual</tspan>
</text>

<rect x="0" y="920" width="580" height="215" rx="18" class="softt"/>
<text x="28" y="962" class="h3">End-to-end flow (New 2026 approach)</text>
<text x="290" y="1018" class="body center">Subcontract → PO → Project Actual → Product Receipt</text>
<text x="290" y="1053" class="body center">→ Vendor Invoice → Match Actuals → Vendor Invoice Actual</text>
<text x="290" y="1088" class="body center">→ Project Margin</text>
</g>

<g transform="translate(40,1240)">
<rect x="0" y="0" width="1200" height="175" rx="20" class="navy"/>
<text x="32" y="46" class="h2 white">Illustrative Example</text>
<text x="40" y="92" class="body white">PO: 100 Hours × ₹3,000 = ₹3,00,000</text>
<text x="40" y="126" class="body white">Actuals recorded: 80 Hours = ₹2,40,000</text>
<text x="650" y="92" class="body white">Vendor invoice received: 100 Hours = ₹3,00,000</text>
<text x="650" y="126" class="body white">NEW insight: Match Actuals exposes the 20-hour variance during invoice review.</text>
</g>

<g transform="translate(40,1450)">
<rect x="0" y="0" width="1200" height="105" rx="20" class="softb"/>
<text x="30" y="38" class="h2">Why this update matters</text>
<text x="48" y="75" class="body">✓ Better AP validation</text>
<text x="330" y="75" class="body">✓ Less manual reconciliation</text>
<text x="660" y="75" class="body">✓ Stronger audit traceability</text>
<text x="960" y="75" class="body">✓ More reliable project margin</text>
</g>

<text x="40" y="1590" class="h3">OV Prakash | Dynamics 365 Project Operations</text>
<text x="1240" y="1590" class="small" text-anchor="end">Real Projects. Real Insights. Better Financial Control.</text>
</svg>