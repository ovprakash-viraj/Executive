<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Governed AI agent ERP transaction lifecycle</title><desc id="d">Detect supplier delay, analyze impact, recommend options, human approval, authorized ERP execution and audit trail</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1935"/><stop offset="1" stop-color="#125b9e"/></linearGradient></defs><rect width="1200" height="630" rx="28" fill="url(#bg)"/><text x="64" y="88" fill="#80d4ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">OV PRAKASH · AGENTIC ERP GOVERNANCE</text><text x="64" y="150" fill="white" font-family="Arial,sans-serif" font-size="40" font-weight="700">AI Agents Can Execute ERP Transactions.</text><text x="64" y="204" fill="white" font-family="Arial,sans-serif" font-size="38" font-weight="700">But Who Is Accountable?</text><text x="64" y="258" fill="#c3e3fc" font-family="Arial,sans-serif" font-size="24">From analysis to action—human approval and auditable controls</text><rect x="48" y="333" width="175" height="143" rx="15" fill="#f1f7ff"/><circle cx="78" cy="367" r="17" fill="#1367b5"/><text x="78" y="375" text-anchor="middle" fill="white" font-size="20" font-family="Arial">1</text><text x="135.5" y="412" text-anchor="middle" fill="#0b2347" font-size="19" font-weight="700" font-family="Arial">DETECT</text><text x="135.5" y="447" text-anchor="middle" fill="#294d71" font-size="16" font-family="Arial">Supplier change</text><rect x="241" y="333" width="175" height="143" rx="15" fill="#f1f7ff"/><circle cx="271" cy="367" r="17" fill="#1367b5"/><text x="271" y="375" text-anchor="middle" fill="white" font-size="20" font-family="Arial">2</text><text x="328.5" y="412" text-anchor="middle" fill="#0b2347" font-size="19" font-weight="700" font-family="Arial">ANALYZE</text><text x="328.5" y="447" text-anchor="middle" fill="#294d71" font-size="16" font-family="Arial">Business impact</text><rect x="434" y="333" width="175" height="143" rx="15" fill="#f1f7ff"/><circle cx="464" cy="367" r="17" fill="#1367b5"/><text x="464" y="375" text-anchor="middle" fill="white" font-size="20" font-family="Arial">3</text><text x="521.5" y="412" text-anchor="middle" fill="#0b2347" font-size="19" font-weight="700" font-family="Arial">RECOMMEND</text><text x="521.5" y="447" text-anchor="middle" fill="#294d71" font-size="16" font-family="Arial">Options & risks</text><rect x="627" y="333" width="175" height="143" rx="15" fill="#e9f8d9"/><circle cx="657" cy="367" r="17" fill="#168252"/><text x="657" y="375" text-anchor="middle" fill="white" font-size="20" font-family="Arial">4</text><text x="714.5" y="412" text-anchor="middle" fill="#0b2347" font-size="19" font-weight="700" font-family="Arial">APPROVE</text><text x="714.5" y="447" text-anchor="middle" fill="#294d71" font-size="16" font-family="Arial">Human decision</text><rect x="820" y="333" width="175" height="143" rx="15" fill="#f1f7ff"/><circle cx="850" cy="367" r="17" fill="#1367b5"/><text x="850" y="375" text-anchor="middle" fill="white" font-size="20" font-family="Arial">5</text><text x="907.5" y="412" text-anchor="middle" fill="#0b2347" font-size="19" font-weight="700" font-family="Arial">EXECUTE</text><text x="907.5" y="447" text-anchor="middle" fill="#294d71" font-size="16" font-family="Arial">ERP transaction</text><rect x="1013" y="333" width="175" height="143" rx="15" fill="#f1f7ff"/><circle cx="1043" cy="367" r="17" fill="#1367b5"/><text x="1043" y="375" text-anchor="middle" fill="white" font-size="20" font-family="Arial">6</text><text x="1100.5" y="412" text-anchor="middle" fill="#0b2347" font-size="19" font-weight="700" font-family="Arial">AUDIT</text><text x="1100.5" y="447" text-anchor="middle" fill="#294d71" font-size="16" font-family="Arial">Trace outcome</text><rect x="48" y="514" width="1107" height="66" rx="12" fill="#0a264d"/><text x="600" y="556" text-anchor="middle" fill="#fff" font-size="23" font-fam