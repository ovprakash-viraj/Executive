<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
<title id="title">Subcontractor Vendor Invoice to Actual Matching in Dynamics 365 Project Operations</title>
<desc id="desc">Flow from subcontract to purchase order, project actual, product receipt, vendor invoice matching, vendor invoice actual, and project margin.</desc>
<style>
.bg{fill:#f7fbff}.navy{fill:#0e3970}.blue{fill:#1e78c8}.teal{fill:#11a09b}.orange{fill:#f47b20}.softb{fill:#eaf5ff}.softt{fill:#eafaf8}.softo{fill:#fff4ea}.white{fill:#fff}
.h1{font:700 48px Arial,sans-serif;fill:#0e3970}.h2{font:700 30px Arial,sans-serif;fill:#0e3970}.h3{font:700 24px Arial,sans-serif;fill:#0e3970}
.body{font:20px Arial,sans-serif;fill:#28496d}.small{font:17px Arial,sans-serif;fill:#395c7e}.center{text-anchor:middle}.bold{font-weight:700}
.card{fill:#fff;stroke:#cfe5f6;stroke-width:2}.line{stroke:#1e78c8;stroke-width:5}.arrow{fill:#1e78c8}
</style>
<rect width="1200" height="1800" class="bg"/>
<text x="600" y="70" class="h1 center">Subcontractor Vendor Invoice → Actual Matching</text>
<text x="600" y="118" class="h2 center" fill="#1667b7">Dynamics 365 Project Operations Integrated with ERP</text>
<text x="600" y="158" class="body center">How subcontract activity becomes validated project cost and project margin</text>

<g transform="translate(40,210)">
<rect x="0" y="0" width="650" height="132" rx="20" class="softb"/><circle cx="55" cy="66" r="30" class="blue"/><text x="55" y="75" class="h3 white center">1</text>
<text x="120" y="58" class="h2">Create Subcontract</text><text x="120" y="92" class="body">Subcontract created in Dataverse</text>
<line x1="325" y1="132" x2="325" y2="164" class="line"/><polygon points="312,155 338,155 325,174" class="arrow"/>

<rect x="0" y="175" width="650" height="132" rx="20" class="softt"/><circle cx="55" cy="241" r="30" class="teal"/><text x="55" y="250" class="h3 white center">2</text>
<text x="120" y="233" class="h2">Purchase Order</text><text x="120" y="267" class="body">PO created in Dynamics 365 Finance</text>
<line x1="325" y1="307" x2="325" y2="339" class="line"/><polygon points="312,330 338,330 325,349" class="arrow"/>

<rect x="0" y="350" width="650" height="132" rx="20" class="softb"/><circle cx="55" cy="416" r="30" class="blue"/><text x="55" y="425" class="h3 white center">3</text>
<text x="120" y="408" class="h2">Record Work</text><text x="120" y="442" class="body">Subcontractor time / expense / material</text>
<line x1="325" y1="482" x2="325" y2="514" class="line"/><polygon points="312,505 338,505 325,524" class="arrow"/>

<rect x="0" y="525" width="650" height="132" rx="20" class="softt"/><circle cx="55" cy="591" r="30" class="teal"/><text x="55" y="600" class="h3 white center">4</text>
<text x="120" y="583" class="h2">Create Cost Actual</text><text x="120" y="617" class="body">Project Operations creates subcontract cost Actual</text>
<line x1="325" y1="657" x2="325" y2="689" class="line"/><polygon points="312,680 338,680 325,699" class="arrow"/>

<rect x="0" y="700" width="650" height="132" rx="20" class="softb"/><circle cx="55" cy="766" r="30" class="blue"/><text x="55" y="775" class="h3 white center">5</text>
<text x="120" y="758" class="h2">Product Receipt</text><text x="120" y="792" class="body">Receipt generated in Finance</text>
<line x1="325" y1="832" x2="325" y2="864" class="line"/><polygon points="312,855 338,855 325,874" class="arrow"/>

<rect x="0" y="875" width="650" height="132" rx="20" class="softt"/><circle cx="55" cy="941" r="30" class="teal"/><text x="55" y="950" class="h3 white center">6</text>
<text x="120" y="933" class="h2">Vendor Invoice + Match Actuals</text><text x="120" y="967" class="body">AP reviews invoice and matches against project Actuals</text>
<line x1="325" y1="1007" x2="325" y2="1039" class="line"/><polygon points="312,1030 338,1030 325,1049" class="arrow"/>

<rect x="0" y="1050" width="650" height="132" rx="20" class="softb"/><circle cx="55" cy="1116" r="30" class="blue"/><text x="55" y="1125" class="h3 white center">7</text>
<text x="120" y="1108" class="h2">Post Vendor Invoice</text><text x="120" y="1142" class="body">Update product receipt if required, then post</text>
<line x1="325" y1="1182" x2="325" y2="1214" class="line"/><polygon points="312,1205 338,1205 325,1224" class="arrow"/>

<rect x="0" y="1225" width="650" height="132" rx="20" class="softt"/><circle cx="55" cy="1291" r="30" class="teal"/><text x="55" y="1300" class="h3 white center">8</text>
<text x="120" y="1283" class="h2">Sync Back to Dataverse</text><text x="120" y="1317" class="body">Reverse original Actual + create Vendor Invoice Actual</text>

<rect x="0" y="1400" width="650" height="125" rx="20" class="navy"/>
<text x="325" y="1453" class="h2 white center">Project Cost &amp; Margin Updated</text>
<text x="325" y="1492" class="body white center">Validated project cost. More accurate project margin.</text>
</g>

<g transform="translate(730,210)">
<rect x="0" y="0" width="430" height="525" rx="22" class="softo"/>
<rect x="0" y="0" width="430" height="72" rx="22" class="orange"/><rect x="0" y="45" width="430" height="27" class="orange"/>
<text x="215" y="48" class="h2 white center">Illustrative Example</text>
<text x="30" y="125" class="h3">PO: 100 Hours × ₹3,000</text><text x="30" y="160" class="h3">= ₹3,00,000</text>
<line x1="30" y1="190" x2="400" y2="190" stroke="#f0c8a8" stroke-width="2"/>
<text x="30" y="245" class="h3">Actuals recorded:</text><text x="30" y="282" class="h3">80 Hours = ₹2,40,000</text>
<line x1="30" y1="315" x2="400" y2="315" stroke="#f0c8a8" stroke-width="2"/>
<text x="30" y="370" class="h3">Vendor invoice:</text><text x="30" y="407" class="h3">100 Hours?</text>
<rect x="25" y="445" width="380" height="55" rx="14" fill="#ffe6cf"/>
<text x="215" y="480" class="h3 center" fill="#e85f0d">Match Actuals exposes the variance</text>

<rect x="0" y="560" width="430" height="420" rx="22" class="softt"/>
<rect x="0" y="560" width="430" height="72" rx="22" class="teal"/><rect x="0" y="605" width="430" height="27" class="teal"/>
<text x="215" y="608" class="h2 white center">Why It Matters</text>
<text x="35" y="690" class="body">✓ Improves AP validation</text>
<text x="35" y="760" class="body">✓ Connects invoice to actual</text><text x="60" y="792" class="body">project consumption</text>
<text x="35" y="860" class="body">✓ Strengthens cost &amp; margin accuracy</text>
<text x="35" y="930" class="body">✓ Improves audit traceability</text>

<text x="215" y="1075" class="h3 center">Key Checkpoints</text>
<text x="215" y="1120" class="small center">Subcontract → PO → Actual → Receipt</text>
<text x="215" y="1152" class="small center">→ Invoice → Match Actuals → Vendor Invoice Actual → Margin</text>
</g>

<text x="600" y="1760" class="h3 center">OV Prakash · Dynamics 365 Project Operations · ERP Transformation</text>
</svg>